version: '3.8'

services:
  app:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    environment:
      - DATABASE_URL=postgresql+asyncpg://stockpredictor:password@postgres:5432/stockpredictor
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  postgres:
    image: postgres:15
    environment:
      - POSTGRES_DB=stockpredictor
      - POSTGRES_USER=stockpredictor
      - POSTGRES_PASSWORD=password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  celery:
    build: .
    command: celery -A app.core.celery worker --loglevel=info
    depends_on:
      - postgres
      - redis
    environment:
      - DATABASE_URL=postgresql+asyncpg://stockpredictor:password@postgres:5432/stockpredictor
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./:/app

  celery-beat:
    build: .
    command: celery -A app.core.celery beat --loglevel=info
    depends_on:
      - postgres
      - redis
    environment:
      - DATABASE_URL=postgresql+asyncpg://stockpredictor:password@postgres:5432/stockpredictor
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./:/app

volumes:
  postgres_data:
  redis_data:
